name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          BODY_EN=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md | awk -f scripts/strip-empty-sections.awk)
          BODY_ZH=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG-zh.md | awk -f scripts/strip-empty-sections.awk)
          RELEASE_DATE=$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/")
          if [ -z "$RELEASE_DATE" ]; then RELEASE_DATE=$(date -u +%Y-%m-%d); fi
          PREV_TAG=$(git tag --sort=-v:refname --merged HEAD | grep -v "^${TAG}$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            RANGE_LINE="递交范围：[\`${PREV_TAG}...${TAG}\`](${COMPARE_URL})"
            RANGE_LINE_EN="Commit range: [\`${PREV_TAG}...${TAG}\`](${COMPARE_URL})"
            FULL_LINE="**完整变更**：[\`${PREV_TAG}...${TAG}\`](${COMPARE_URL})"
          else
            RANGE_LINE="递交范围：首个发布版本"
            RANGE_LINE_EN="Commit range: initial release"
            FULL_LINE="**完整变更**：首个发布版本"
          fi
          {
            echo "## Skills Manager ${TAG}"
            echo ""
            echo "发布日期：\`${RELEASE_DATE}\`"
            echo "${RANGE_LINE}"
            echo ""
            echo "$BODY_ZH"
            echo ""
            echo "### 当前校验状态"
            echo ""
            echo "- CLI 跨平台构建通过（macOS Intel / macOS ARM / Windows x64 / Linux x64）"
            echo "- Rust 测试通过"
            echo ""
            echo "---"
            echo ""
            echo "<details><summary>English release notes</summary>"
            echo ""
            echo "Release date: \`${RELEASE_DATE}\`"
            echo "${RANGE_LINE_EN}"
            echo ""
            echo "$BODY_EN"
            echo ""
            echo "### Current Verification"
            echo ""
            echo "- CLI cross-platform build passed (macOS Intel / macOS ARM / Windows x64 / Linux x64)"
            echo "- Rust tests passed"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "${FULL_LINE}"
            echo ""
            echo "Full changelog files: [English](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) | [中文](https://github.com/${{ github.repository }}/blob/main/CHANGELOG-zh.md)"
          } > /tmp/release-notes.md
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release-meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Skills Manager ${TAG}" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Skills Manager ${TAG}" --notes-file /tmp/release-notes.md
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: cli
          save-if: false

      - name: Build CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --bin skills-manager-cli --target ${{ matrix.target }}

      - name: Test CLI
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Package CLI
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="cli/target/${{ matrix.target }}/release/skills-manager-cli"
          ASSET="skills-manager-cli-${{ matrix.label }}.tar.gz"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="${BIN}.exe"
            ASSET="skills-manager-cli-${{ matrix.label }}.zip"
            cp "$BIN" dist/skills-manager-cli.exe
            powershell -NoProfile -Command "Compress-Archive -Path dist/skills-manager-cli.exe -DestinationPath ${ASSET} -Force"
          else
            cp "$BIN" dist/skills-manager-cli
            tar -C dist -czf "$ASSET" skills-manager-cli
          fi
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "${{ steps.package.outputs.asset }}" --clobber
